<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A frame-exact, vector-rendered machine learning review built with manim-web."
    />
    <title>ESAP Review · manim-web</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070d;
        --surface: #0a0e18;
        --ink: #e8ecf4;
        --dim: #8b94a8;
        --cyan: #58c4dd;
        --coral: #fc6255;
        --gold: #e8c547;
        --green: #83c167;
        --purple: #b085f5;
        --teal: #5cd0b3;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background-color: var(--bg);
        background-image: radial-gradient(rgba(232, 236, 244, 0.06) 0.7px, transparent 0.7px);
        background-size: 18px 18px;
        color: var(--ink);
        font-family: Aptos, Candara, 'Segoe UI', sans-serif;
      }

      button,
      select {
        font: inherit;
      }

      .app {
        width: min(1320px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 36px;
      }

      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        align-items: end;
        margin: 0 auto 18px;
        max-width: 1280px;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: var(--cyan);
        font-family: 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Charter, 'Iowan Old Style', Cambria, serif;
        font-size: clamp(28px, 4vw, 52px);
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 0.96;
      }

      .format {
        margin: 0 0 3px;
        color: var(--dim);
        font-family: 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-align: right;
      }

      .stage-frame {
        position: relative;
        max-width: 1280px;
        margin: 0 auto;
        padding: 1px;
        background: linear-gradient(
          90deg,
          rgba(88, 196, 221, 0.9),
          rgba(232, 197, 71, 0.32) 46%,
          rgba(176, 133, 245, 0.72)
        );
        box-shadow:
          0 28px 80px rgba(0, 0, 0, 0.46),
          0 0 0 1px rgba(232, 236, 244, 0.06);
      }

      #stage {
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: var(--bg);
      }

      #stage canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      .readout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: center;
        max-width: 1280px;
        margin: 16px auto 0;
      }

      #status {
        margin: 0;
        color: var(--dim);
        font-size: 13px;
      }

      #status[data-state='ready'] {
        color: var(--teal);
      }

      #status[data-state='error'] {
        color: var(--coral);
      }

      .hint {
        margin: 0;
        color: var(--dim);
        font-family: 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;
        font-size: 11px;
        text-align: right;
      }

      .chapter-rail {
        display: flex;
        gap: 2px;
        max-width: 1280px;
        margin: 12px auto 0;
        overflow: hidden;
      }

      .chapter {
        position: relative;
        flex-basis: 0;
        min-width: 25px;
        height: 54px;
        padding: 9px 8px 7px;
        overflow: hidden;
        border: 0;
        border-top: 2px solid var(--chapter-color);
        background: rgba(232, 236, 244, 0.045);
        color: var(--dim);
        cursor: pointer;
        text-align: left;
        transition:
          color 140ms ease,
          background-color 140ms ease;
      }

      .chapter:hover,
      .chapter:focus-visible {
        background: rgba(232, 236, 244, 0.1);
        color: var(--ink);
      }

      .chapter:focus-visible {
        outline: 2px solid var(--chapter-color);
        outline-offset: -2px;
      }

      .chapter-index {
        display: block;
        margin-bottom: 3px;
        font-family: 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;
        font-size: 9px;
        letter-spacing: 0.12em;
      }

      .chapter-title {
        display: block;
        overflow: hidden;
        font-size: 11px;
        line-height: 1.1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @media (max-width: 720px) {
        .app {
          width: min(100% - 18px, 1320px);
          padding-top: 20px;
        }

        .masthead,
        .readout {
          grid-template-columns: 1fr;
          gap: 8px;
        }

        .format,
        .hint {
          text-align: left;
        }

        .chapter {
          height: 24px;
          padding: 0;
        }

        .chapter-index,
        .chapter-title {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .chapter {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="masthead">
        <div>
          <p class="eyebrow">ESAP review · web vector edition</p>
          <h1>Machine learning, on one timeline.</h1>
        </div>
        <p class="format">14.22 × 8 world stage<br />60 frames per second · 203.359 seconds</p>
      </header>

      <section class="stage-frame" aria-label="ESAP animation player">
        <div id="stage"></div>
      </section>

      <div class="readout">
        <p id="status" role="status" aria-live="polite">Recording the eight-section timeline…</p>
        <p class="hint">Space plays · arrows navigate · F enters full screen</p>
      </div>

      <nav id="chapters" class="chapter-rail" aria-label="Review sections"></nav>
    </main>

    <script type="module" src="./esap_review.ts"></script>
  </body>
</html>
